name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.10"
  NODE_VERSION: "20"

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff
      - run: ruff check src/ glacierkz-api/app/ scripts/ --select E,F,W,I --ignore E501
      - run: ruff format src/ glacierkz-api/app/ scripts/ --check --diff

  test:
    name: Tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.lock
      - run: pip install pytest-cov pytest-asyncio
      - name: Run tests with coverage
        run: |
          python -m pytest tests/ glacierkz-api/tests/ -v \
            -m "not experimental and not local_data" \
            --cov=src --cov=glacierkz-api/app \
            --cov-report=xml --cov-report=json:coverage.json --cov-report=term-missing \
            --cov-fail-under=45
      - name: Enforce transparent production and repository coverage gates
        run: |
          python scripts/report_coverage_scopes.py \
            --coverage coverage.json \
            --output coverage-scopes.json
      - uses: codecov/codecov-action@v4
        if: always()
        with:
          file: coverage.xml
          fail_ci_if_error: false
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: python-coverage-evidence
          path: |
            coverage.xml
            coverage.json
            coverage-scopes.json

  typecheck:
    name: Type Check (Pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.lock pyright
      - run: pyright

  frontend-test:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glacierkz-web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: glacierkz-web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint -- --max-warnings 0
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend-test]
    defaults:
      run:
        working-directory: glacierkz-web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: glacierkz-web/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          npm ci
          pip install -r ../requirements.lock
      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps
      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: npm run build
      - name: Run Playwright tests with API
        env:
          CI: true
          PLAYWRIGHT_API_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          CORS_ORIGINS: http://127.0.0.1:3000
        run: |
          export PYTHONPATH="${{ github.workspace }}"
          cd "${{ github.workspace }}/glacierkz-api"
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/glacierkz-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT

          api_ready=false
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null; then
              api_ready=true
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          if [ "$api_ready" != true ]; then
            cat /tmp/glacierkz-api.log
            exit 1
          fi

          cd "${{ github.workspace }}/glacierkz-web"
          npm run test:e2e

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.lock bandit pip-audit==2.10.1
      - name: Run Bandit (Python security)
        run: bandit -r glacierkz-api/app/ -ll --skip B101
      - name: Run pip-audit (dependency vulnerabilities)
        run: python scripts/audit_dependencies.py

  validate:
    name: Env Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python scripts/validate-env.py

  docker-build:
    name: Docker Build (Core API and Web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build API image
        run: docker build -f glacierkz-api/Dockerfile.full -t glacierkz-api-test .
      - name: Build Web image
        run: docker build -t glacierkz-web-test ./glacierkz-web
      - name: Validate unified Compose configuration
        run: docker compose config --quiet
