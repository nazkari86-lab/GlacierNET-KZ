[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glaciernet-kz"
version = "0.2.0"
description = "Multi-language glacier monitoring platform for Kazakhstan"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.12"
authors = [
    {name = "Dulat Nurlanuly", email = "rinatamankos6@gmail.com"},
]
keywords = ["glacier", "remote-sensing", "deep-learning", "segmentation", "kazakhstan"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "tensorflow==2.15.1",
    "numpy>=1.26.4,<2.0.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.5.0",
    "protobuf>=4.25.9,<5.0.0",
    "rasterio>=1.3.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "fiona>=1.9.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "python-dotenv>=1.2.2",
    "tqdm>=4.66.3",
    "pillow>=12.3.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "xarray>=2024.1,<2025.1.2",
    "netCDF4>=1.6,<2",
    "pyarrow>=23.0.1,<24",
]

[project.optional-dependencies]
api = [
    "fastapi==0.140.0",
    "starlette==1.3.1",
    "uvicorn[standard]==0.27.0",
    "redis==5.0.1",
    "python-multipart==0.0.31",
    "httpx>=0.28.1",
    "psutil==7.2.2",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "pyright>=1.1.0",
]

[project.scripts]
glacierkz = "predict:main"

[project.urls]
Homepage = "https://github.com/nazkari86-lab/GlacierNET-KZ"
Documentation = "https://github.com/nazkari86-lab/GlacierNET-KZ/tree/main/docs"
Repository = "https://github.com/nazkari86-lab/GlacierNET-KZ"
Issues = "https://github.com/nazkari86-lab/GlacierNET-KZ/issues"
Changelog = "https://github.com/nazkari86-lab/GlacierNET-KZ/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=src --cov-report=term-missing --cov-fail-under=35"
asyncio_mode = "auto"
markers = [
    "experimental: Phase 10 scaffold modules — excluded from CI until production-ready",
    "integration: Requires external services or large data downloads",
    "local_data: Requires physical datasets or model artifacts intentionally excluded from Git",
]
